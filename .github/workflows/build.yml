
name: Build AlzaYouTubeExtreme ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses


      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0" \
                     "ndk;29.0.14206865" \
                     "cmake;3.22.1"

      - name: Build Auto ARM64 release APK
        run: |
          chmod +x gradlew
          ./gradlew clean :fermata:assembleAutoRelease \
            -PABI=arm64-v8a \
            -PAPP_ID_SFX= \
            -Pfree=true \
            -Porg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: AlzaYouTubeExtreme-ARM64
          path: fermata/build/outputs/apk/auto/release/*.apk
          if-no-files-found: error
